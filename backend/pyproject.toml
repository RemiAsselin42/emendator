[project]
name = "emendator-backend"
version = "0.1.0"
description = "Local FastAPI sidecar for Emendator (drives parsing + Docker runner)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.10",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28",
    "mcp[cli]>=2.0.0",
    "anthropic>=0.121.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pyright>=1.1.411",
    "ruff>=0.16.2",
    "pyinstaller>=6.22.0",
]

# Application, not a distributable package: skip building/installing our own code.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
